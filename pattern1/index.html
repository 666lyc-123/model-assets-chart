<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>模式1-纯数据</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --light: #f8fafc;
            --dark: #1e293b;
            --card-bg: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            --border-radius: 12px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.4;
            padding: 0;
        }
        
        @media (max-width: 320px) { body { font-size: 12px; } }
        @media (min-width: 321px) and (max-width: 375px) { body { font-size: 13px; } }
        @media (min-width: 376px) and (max-width: 425px) { body { font-size: 14px; } }
        
        .app-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 12px;
        }
        
        .compact-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        .compact-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        
        .time-display {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        
        .chart-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .chart-container {
            width: 100%;
            height: 280px;
        }
        
        .compact-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
            padding: 8px 0;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #475569;
            padding: 4px 8px;
            background: #f1f5f9;
            border-radius: 6px;
        }
        
        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .models-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .model-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 100%);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }
        
        .model-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .model-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .model-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .model-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .model-value {
            font-size: 1.3rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .model-change {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .change-up { color: var(--success); }
        .change-down { color: var(--danger); }
        .change-icon { font-size: 0.9rem; }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .loading::after {
            content: '';
            width: 12px;
            height: 12px;
            margin-left: 8px;
            border: 2px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="compact-header">
            <h1>模式1-纯数据</h1>
            <div class="time-display" id="currentTime">2026-03-02 22:01:46</div>
        </div>
        
        <div class="chart-section">
            <div class="section-title">📈 资产趋势对比</div>
            <div id="chart" class="chart-container">
                <div class="loading">正在加载图表...</div>
            </div>
            <div id="chartLegend" class="compact-legend"></div>
        </div>
        
        <div class="models-grid" id="modelsContainer"></div>
    </div>

    <script src="./assets_data.js?v=202603022201"></script>
    <script>
        const isMobile = window.innerWidth <= 768;
        const isSmallMobile = window.innerWidth <= 375;
        const colors = {"deepseek-v3": "#2196f3", "qwen-72b": "#ff9800", "gpt-5": "#e91e63", "gemini-3-pro": "#4caf50", "llama-3.1-405b": "#9c27b0", "multi-agent": "#00bcd4"};
        const shortNames = {"deepseek-v3": "DeepSeek", "qwen-72b": "Qwen", "gpt-5": "GPT-5", "gemini-3-pro": "Gemini", "llama-3.1-405b": "Llama", "multi-agent": "Multi-Agent"};
        
        function getDeviceConfig() {
            if (isSmallMobile) {
                return { chartHeight: 250, fontSize: 9, lineWidth: 1.8, legendFontSize: 10, showLegend: false };
            } else if (isMobile) {
                return { chartHeight: 280, fontSize: 10, lineWidth: 2, legendFontSize: 11, showLegend: true };
            } else {
                return { chartHeight: 320, fontSize: 12, lineWidth: 2.2, legendFontSize: 12, showLegend: true };
            }
        }
        
        async function initMobileDashboard() {
            if (typeof modelAssetsData === 'undefined') {
                showErrorMessage('数据加载失败，请刷新页面');
                return;
            }
            await renderMobileChart();
            renderModelCards();
            startTimeUpdates();
        }
        
        async function renderMobileChart() {
            const traces = [];
            const deviceConfig = getDeviceConfig();
            const legendContainer = document.getElementById('chartLegend');
            if (deviceConfig.showLegend) {
                legendContainer.innerHTML = '';
            } else {
                legendContainer.classList.add('hidden');
            }
            
            // 收集所有数据用于动态计算范围
            let allValues = [];
            let allDates = [];
            
            for (const [modelName, data] of Object.entries(modelAssetsData)) {
                if (!data || data.length === 0) continue;
                const x = data.map(item => item[0]);
                const y = data.map(item => item[1]);
                const color = colors[modelName] || '#666';
                traces.push({
                    x: x, y: y, mode: 'lines+markers', type: 'scatter',
                    name: getModelShortName(modelName),
                    line: { color: color, width: deviceConfig.lineWidth, shape: 'spline', smoothing: 0.3 },
                    marker: { size: isMobile ? 4 : 5, color: color, opacity: 0.7 },
                    hoverinfo: 'x+y+name',
                    hovertemplate: '<b>%{x}</b><br><span style="color:%{line.color}">●</span> <b>%{data.name}</b>: ¥%{y:,.0f}<br><extra></extra>'
                });
                if (deviceConfig.showLegend) {
                    const legendItem = document.createElement('div');
                    legendItem.className = 'legend-item';
                    legendItem.innerHTML = `<div class="legend-color" style="background:${color}"></div><span>${getModelShortName(modelName)}</span>`;
                    legendContainer.appendChild(legendItem);
                }
                allValues.push(...y);
                allDates.push(...x);
            }
            
            if (traces.length === 0) {
                showErrorMessage('暂无有效数据');
                return;
            }
            
            // 动态计算Y轴范围（每20000一个刻度，确保所有数据可见）
            const minVal = Math.min(...allValues);
            const maxVal = Math.max(...allValues);
            const padding = (maxVal - minVal) * 0.05; // 5% 边距
            // 向下取整到最近的20000
            const yMin = Math.floor((minVal - padding) / 20000) * 20000;
            // 向上取整到最近的20000
            const yMax = Math.ceil((maxVal + padding) / 20000) * 20000;
            
            // 生成Y轴刻度（每20000一个）
            const yTickVals = [];
            const yTickTexts = [];
            for (let v = yMin; v <= yMax; v += 20000) {
                yTickVals.push(v);
                yTickTexts.push(v.toLocaleString());
            }
            
            // 计算X轴范围（从最早日期到最晚日期）
            const dateObjs = allDates.map(d => new Date(d));
            const minDate = new Date(Math.min(...dateObjs));
            const maxDate = new Date(Math.max(...dateObjs));
            
            // 设置X轴刻度：从最早日期开始，每15天一个
            const tick0 = minDate;
            const dtick = 15 * 24 * 60 * 60 * 1000; // 15天（毫秒）
            
            const layout = {
                xaxis: { 
                    tickfont: { size: deviceConfig.fontSize }, 
                    type: 'date', 
                    tickformat: '%m/%d',
                    tick0: tick0,
                    dtick: dtick,
                    gridcolor: 'rgba(0,0,0,0.05)',
                    range: [minDate, maxDate]
                },
                yaxis: { 
                    tickfont: { size: deviceConfig.fontSize-2 }, 
                    tickformat: ',.0f',
                    tickmode: 'array',
                    tickvals: yTickVals,
                    ticktext: yTickTexts,
                    range: [yMin, yMax],
                    gridcolor: 'rgba(0,0,0,0.05)'
                },
                hovermode: 'x unified', 
                hoverlabel: { font: { size: deviceConfig.fontSize } },
                plot_bgcolor: 'white', 
                paper_bgcolor: 'white',
                legend: { 
                    orientation: 'h', 
                    y: -0.25, 
                    font: { size: deviceConfig.legendFontSize }, 
                    xanchor: 'center', 
                    x: 0.5, 
                    visible: deviceConfig.showLegend 
                },
                margin: { l: 70, r: 20, t: 10, b: 50 },
                showlegend: deviceConfig.showLegend, 
                autosize: true, 
                dragmode: false, 
                scrollZoom: false
            };
            
            try {
                document.getElementById('chart').innerHTML = '';
                await Plotly.newPlot('chart', traces, layout, { 
                    responsive: true, 
                    displaylogo: false, 
                    modeBarButtonsToRemove: ['lasso2d', 'select2d'] 
                });
            } catch(error) {
                showErrorMessage('图表渲染失败: ' + error.message);
            }
        }
        
        function renderModelCards() {
            const container = document.getElementById('modelsContainer');
            let cardsHTML = '';
            
            for (const [modelName, data] of Object.entries(modelSummaryData)) {
                const color = colors[modelName] || '#666';
                const shortName = getModelShortName(modelName);
                const change = data.change_pct;
                const changeClass = change >= 0 ? 'change-up' : 'change-down';
                const changeIcon = change >= 0 ? '↗' : '↘';
                const changeText = change >= 0 ? `+${change.toFixed(1)}%` : `${change.toFixed(1)}%`;
                const formattedValue = '¥' + Math.round(data.current).toLocaleString();
                
                cardsHTML += `
                    <div class="model-card">
                        <div class="model-header">
                            <div class="model-name">
                                <div class="model-color-dot" style="background:${color}"></div>
                                ${shortName}
                            </div>
                        </div>
                        <div class="model-value" style="color:${color}">${formattedValue}</div>
                        <div class="model-change ${changeClass}">
                            <span class="change-icon">${changeIcon}</span>
                            <span>${changeText}</span>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = cardsHTML || '<div class="loading">暂无模型数据</div>';
        }
        
        function getModelShortName(fullName) {
            return shortNames[fullName] || fullName;
        }
        
        function startTimeUpdates() {
            function updateTime() {
                const now = new Date();
                document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN');
            }
            updateTime();
            setInterval(updateTime, 1000);
        }
        
        function showErrorMessage(message) {
            document.getElementById('chart').innerHTML = `<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;color:#64748b;text-align:center;padding:20px;"><div style="font-size:24px;margin-bottom:10px;">📊</div><div style="font-size:14px;font-weight:600;margin-bottom:8px;">图表加载失败</div><div style="font-size:12px;">${message}</div><button onclick="window.location.reload()" style="margin-top:16px;padding:8px 16px;background:var(--primary);color:white;border:none;border-radius:6px;">刷新页面</button></div>`;
        }
        
        window.addEventListener('resize', function() {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(() => {
                renderMobileChart();
                Plotly.Plots.resize(document.getElementById('chart'));
            }, 250);
        });
        
        document.addEventListener('DOMContentLoaded', initMobileDashboard);
    </script>
</body>
</html>
