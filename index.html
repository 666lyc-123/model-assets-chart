<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大模型交易分析</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #7c3aed;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: #1e293b;
            padding: 16px;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 20px;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .pattern-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.7) 100%);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            transition: all 0.3s ease;
        }
        
        .pattern-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: var(--primary);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .card-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            flex: 1;
            color: #1e293b;
        }
        
        .card-arrow {
            font-size: 20px;
            color: var(--primary);
        }
        
        @media (max-width: 375px) {
            .card-icon {
                width: 36px;
                height: 36px;
                font-size: 20px;
            }
            
            .card-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 大模型交易分析</h1>
        </div>
        
        <div class="cards-container">
            <a href="pattern1/index.html" class="pattern-card">
                <div class="card-header">
                    <div class="card-icon">📈</div>
                    <div class="card-title">模式1-纯数据</div>
                    <div class="card-arrow">→</div>
                </div>
            </a>
            
            <a href="pattern2/index.html" class="pattern-card">
                <div class="card-header">
                    <div class="card-icon">⚙️</div>
                    <div class="card-title">模式2-数据+技术</div>
                    <div class="card-arrow">→</div>
                </div>
            </a>
            
            <a href="pattern3/index.html" class="pattern-card">
                <div class="card-header">
                    <div class="card-icon">📰</div>
                    <div class="card-title">模式3-数据+新闻</div>
                    <div class="card-arrow">→</div>
                </div>
            </a>
            
            <a href="pattern4/index.html" class="pattern-card">
                <div class="card-header">
                    <div class="card-icon">🤖</div>
                    <div class="card-title">模式4-多智能体</div>
                    <div class="card-arrow">→</div>
                </div>
            </a>
            
            <a href="pattern5/index.html" class="pattern-card">
                <div class="card-header">
                    <div class="card-icon">💰</div>
                    <div class="card-title">模式5-巴菲特</div>
                    <div class="card-arrow">→</div>
                </div>
            </a>
        </div>
    </div>
    
    <script>
        // 添加卡片点击效果
        document.querySelectorAll('.pattern-card').forEach(card => {
            card.addEventListener('click', function(e) {
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>
</body>
</html>
