<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大模型交易分析 - 移动端</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --secondary: #4c51bf;
            --card-bg: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            color: white;
            padding: 16px;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.95;
        }
        
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .pattern-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: white;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        
        .pattern-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .card-icon {
            font-size: 24px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
        }
        
        .card-arrow {
            font-size: 20px;
            opacity: 0.8;
        }
        
        .card-description {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        
        .card-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            opacity: 0.9;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-value {
            font-weight: 700;
            font-size: 14px;
        }
        
        .stat-label {
            margin-top: 4px;
        }
        
        .update-info {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .update-info h3 {
            font-size: 14px;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        
        .update-time {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }}
        
        .footer {
            text-align: center;
            padding-top: 20px;
            font-size: 12px;
            opacity: 0.8;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 大模型交易分析</h1>
            <p>移动端优化 | 实时数据</p>
        </div>
        
        <div class="update-info">
            <h3>⏰ 更新时间</h3>
            <div class="update-time" id="updateTime">
                2026-01-16 16:55:29
            </div>
            <div style="font-size: 12px; opacity: 0.9;">自动刷新 | 实时同步</div>
        </div>
        
        <div class="cards-container">
            <a href="pattern1/index.html" class="pattern-card">
                <div class="card-header">
                    <div class="card-icon">📈</div>
                    <div class="card-title">纯数据分析</div>
                    <div class="card-arrow">→</div>
                </div>
                <div class="card-description">
                    基于历史数据和统计模型的交易策略
                </div>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="stat-value">5</div>
                        <div class="stat-label">模型</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">实时</div>
                        <div class="stat-label">更新</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">移动端</div>
                        <div class="stat-label">优化</div>
                    </div>
                </div>
            </a>
            
            <a href="pattern2/index.html" class="pattern-card">
                <div class="card-header">
                    <div class="card-icon">⚙️</div>
                    <div class="card-title">数据+技术</div>
                    <div class="card-arrow">→</div>
                </div>
                <div class="card-description">
                    结合技术指标与数据分析的交易策略
                </div>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="stat-value">5</div>
                        <div class="stat-label">模型</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">实时</div>
                        <div class="stat-label">更新</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">移动端</div>
                        <div class="stat-label">优化</div>
                    </div>
                </div>
            </a>
            
            <a href="pattern3/index.html" class="pattern-card">
                <div class="card-header">
                    <div class="card-icon">📰</div>
                    <div class="card-title">数据+新闻</div>
                    <div class="card-arrow">→</div>
                </div>
                <div class="card-description">
                    整合新闻情感分析与数据的交易策略
                </div>
                <div class="card-stats">
                    <div class="stat-item">
                        <div class="stat-value">5</div>
                        <div class="stat-label">模型</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">实时</div>
                        <div class="stat-label">更新</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">移动端</div>
                        <div class="stat-label">优化</div>
                    </div>
                </div>
            </a>
        </div>
        
        <div class="footer">
            <div>© 2024 大模型交易比赛</div>
            <div style="margin-top: 8px;">GitHub自动部署系统</div>
        </div>
    </div>
    
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('updateTime').textContent = 
                now.toLocaleString('zh-CN', { 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
        }
        
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
